<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Dino Runner — a tiny browser endless runner</title>
    <meta
      name="description"
      content="An original, dependency-free endless runner in the spirit of the Chrome dino game. Jump cacti, duck pterodactyls, chase your high score."
    />
    <meta name="theme-color" content="#f7f7f7" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <svg class="mark" viewBox="0 0 27 29" aria-hidden="true" focusable="false">
            <path
              fill="currentColor"
              d="M19 0h7v1h-7zM17 1h10v1h-10zM16 2h11v1h-11zM15 3h6v1h-6zM22 3h5v1h-5zM15 4h12v1h-12zM15 5h12v1h-12zM15 6h12v1h-12zM15 7h12v1h-12zM15 8h8v1h-8zM16 9h7v1h-7zM17 10h5v1h-5zM15 11h7v1h-7zM2 12h19v1h-19zM0 13h21v1h-21zM0 14h20v1h-20zM1 15h19v1h-19zM3 16h17v1h-17zM5 17h17v1h-17zM6 18h16v1h-16zM6 19h16v1h-16zM6 20h15v1h-15zM7 21h12v1h-12zM8 22h10v1h-10zM7 23h4v1h-4zM14 23h4v1h-4zM7 24h4v1h-4zM14 24h4v1h-4zM7 25h4v1h-4zM14 25h4v1h-4zM7 26h4v1h-4zM14 26h4v1h-4zM7 27h5v1h-5zM14 27h5v1h-5zM8 28h4v1h-4zM15 28h4v1h-4z"
            />
          </svg>
          <h1>DINO RUNNER</h1>
        </div>
        <span class="chip">BEST <b id="best">0</b></span>
      </header>

      <main class="stage" id="stage">
        <canvas
          id="game"
          width="1200"
          height="320"
          role="img"
          aria-label="Dino Runner. Press space or tap to start."
        ></canvas>
      </main>

      <div class="controls">
        <p class="keys">
          <span><kbd>SPACE</kbd> / <kbd>↑</kbd> jump</span>
          <span><kbd>↓</kbd> duck</span>
          <span><kbd>P</kbd> pause</span>
          <span><kbd>M</kbd> sound</span>
        </p>
        <div class="buttons">
          <button id="btn-sound" type="button" aria-pressed="true">SOUND ON</button>
          <button id="btn-pause" type="button" aria-pressed="false">PAUSE</button>
          <button id="btn-restart" type="button">RESTART</button>
        </div>
      </div>

      <div class="touch-controls">
        <button id="btn-duck" type="button">DUCK</button>
        <button id="btn-jump" type="button">JUMP</button>
      </div>

      <p class="foot">
        Original pixel art and a hand-rolled canvas engine. No frameworks, no build step — open it and run.
      </p>

      <p id="live" class="sr-only" aria-live="polite"></p>
    </div>

    <script src="js/sprites.js"></script>
    <script src="js/game.js"></script>
  </body>
</html>
